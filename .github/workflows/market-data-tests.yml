name: Market data offline tests
'on':
  push:
    branches: ['codex/market-data-store']
    paths: ['market_data_store.py', 'kis_market_collection.py', 'kis_index_store.py', 'backtest_market_inputs.py', 'daily_market_data.py', 'scripts/*market_data*', 'tests/test_market_data_store.py', 'tests/test_backtest_market_inputs.py', 'tests/test_daily_market_data.py', '.github/workflows/market-data*.yml', 'requirements-market-data.txt']
  pull_request:
    paths: ['market_data_store.py', 'kis_market_collection.py', 'kis_index_store.py', 'backtest_market_inputs.py', 'daily_market_data.py', 'scripts/*market_data*', 'tests/test_market_data_store.py', 'tests/test_backtest_market_inputs.py', 'tests/test_daily_market_data.py', '.github/workflows/market-data*.yml', 'requirements-market-data.txt']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-market-data.txt pytest pyyaml
      - run: python -m pytest -q tests/test_market_data_store.py tests/test_backtest_market_inputs.py tests/test_daily_market_data.py tests/test_security_lifecycle.py
