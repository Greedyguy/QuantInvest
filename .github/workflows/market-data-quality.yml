name: Market data quality and backtest inputs (no orders)

'on':
  workflow_call:
    inputs:
      code_ref:
        type: string
        required: true
      data_ref:
        type: string
        default: main
      start:
        type: string
        default: '2025-01-01'
      end:
        type: string
        default: '2026-08-31'
      warmup_start:
        type: string
        default: '2024-01-01'
      include_etfs:
        type: boolean
        default: true
    secrets:
      MARKET_DATA_REPO_TOKEN:
        required: true

permissions:
  contents: read
concurrency:
  group: market-data-quality-report
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATA_REPOSITORY: ${{ vars.MARKET_DATA_REPOSITORY }}
      REPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      REPORT_BRANCH: validation/run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.code_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-market-data.txt
      - name: Require a separate private data repository
        env:
          DATA_REPO_TOKEN: ${{ secrets.MARKET_DATA_REPO_TOKEN }}
          CODE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, re, requests
          repo, token = os.environ['DATA_REPOSITORY'], os.environ['DATA_REPO_TOKEN']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo) or not token:
              raise SystemExit('Missing private repository connection.')
          if repo.lower() == os.environ['CODE_REPOSITORY'].lower():
              raise SystemExit('Use a separate private data repository.')
          response = requests.get('https://api.github.com/repos/'+repo,
              headers={'Authorization': 'Bearer '+token, 'Accept': 'application/vnd.github+json'}, timeout=30)
          if response.status_code != 200 or response.json().get('private') is not True:
              raise SystemExit('Destination unavailable or not private.')
          PY
      - uses: actions/checkout@v6
        with:
          repository: ${{ vars.MARKET_DATA_REPOSITORY }}
          token: ${{ secrets.MARKET_DATA_REPO_TOKEN }}
          ref: ${{ inputs.data_ref }}
          path: market-data-private
          fetch-depth: 1
      - name: Pin input snapshot
        run: |
          echo "QUALITY_DATA_SHA=$(git -C market-data-private rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "QUALITY_CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OUTPUT_PATH=$RUNNER_TEMP/market-data-quality-$REPORT_ID" >> "$GITHUB_ENV"
      - name: Offline quality checks and input preparation
        id: prepare
        env:
          EVAL_START: ${{ inputs.start }}
          EVAL_END: ${{ inputs.end }}
          WARMUP_START: ${{ inputs.warmup_start }}
          INCLUDE_ETFS: ${{ inputs.include_etfs }}
        run: |
          extra=()
          if [ "$INCLUDE_ETFS" != 'true' ]; then extra+=(--stocks-only); fi
          python scripts/prepare_market_data_backtest.py \
            --store market-data-private/store --output "$OUTPUT_PATH" \
            --start "$EVAL_START" --end "$EVAL_END" --warmup-start "$WARMUP_START" \
            --master-date '2026-09-28' --min-history 120 \
            --data-commit "$QUALITY_DATA_SHA" --code-commit "$QUALITY_CODE_SHA" "${extra[@]}"
      - name: Save report and prepared inputs to a new PRIVATE report branch
        id: publish
        run: |
          git -C market-data-private switch -c "$REPORT_BRANCH"
          mkdir -p "market-data-private/validation_runs/$REPORT_ID"
          cp -R "$OUTPUT_PATH/." "market-data-private/validation_runs/$REPORT_ID/"
          git -C market-data-private config user.name 'github-actions[bot]'
          git -C market-data-private config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C market-data-private add -- "validation_runs/$REPORT_ID/"
          git -C market-data-private commit -q -m 'data: private backtest input quality report'
          git -C market-data-private push origin "$REPORT_BRANCH"
      - name: Summarize and gate readiness
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['OUTPUT_PATH'])/'report.json').read_text())
          labels = {'blocked': '차단 — 수집 누락·품질·준비 기간 확인 필요',
                    'review_required': '입력 생성 / 기업행동·가격 변동 추가 검토 필요',
                    'ready_for_research_inputs': '연구용 입력 준비 완료 (실전 운용 승인 아님)'}
          url = ('https://github.com/'+os.environ['DATA_REPOSITORY']+'/blob/'+os.environ['REPORT_BRANCH']+
                 '/validation_runs/'+os.environ['REPORT_ID']+'/report.md')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## 데이터 연결·품질 검사\n\n'+labels[r['status']]+'\n\n')
              f.write(f'- 대상 종목: {r["target_tickers"]} / 검증 조각: {r["verified_segments"]}\n')
              f.write(f'- 차단: {r["issue_counts"]["blocker"]} / 추가 검토: {r["issue_counts"]["review"]}\n')
              f.write(f'- 원본 데이터 버전: `{r["data_commit"]}`\n- [비공개 상세 보고서]({url})\n\n')
              f.write('수집 중이면 차단이 정상입니다. 기존 수집·원본 main·주문 설정을 변경하지 않았습니다.\n')
          if r['status'] == 'blocked':
              raise SystemExit('Data readiness blocked; diagnostic report saved privately.')
          if r['status'] == 'review_required':
              print('::warning::Prepared inputs require corporate-action/price-jump review before simulation.')
          PY
