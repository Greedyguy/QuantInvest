name: Daily Open Exec A (Live)

on:
  schedule:
    # KST 09:00 (장 시작) = UTC 00:00, 월~금
    # ※ ubuntu-latest 큐 지연 ~1.5h → 실제 실행 10:30~11:00
    #   Oracle 셋업 후 즉시 실행(지연 없음)으로 전환 예정
    - cron: "0 0 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-signal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.signal.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Check current KST decision date without broker credentials
        id: signal
        run: python scripts/check_kr_signal_ready.py --github-output "$GITHUB_OUTPUT"

  prepare-signal:
    needs: check-signal
    if: needs.check-signal.outputs.ready != 'true'
    uses: ./.github/workflows/daily-eod-signal.yml
    with:
      publish_signal: true
    secrets:
      MARKET_DATA_REPO_TOKEN: ${{ secrets.MARKET_DATA_REPO_TOKEN }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

  run-live:
    needs: [check-signal, prepare-signal]
    # Research shadow failure must remain visible but cannot discard a separately
    # verified/published production signal. Revalidate after the latest checkout.
    if: >-
      ${{ always() && !cancelled() && needs.check-signal.result == 'success' &&
          (needs.check-signal.outputs.ready == 'true' ||
           needs.prepare-signal.outputs.signal_published == 'true') }}
    concurrency:
      # Acquire only here: collection also uses this lock, so holding it around
      # the entire parent workflow would deadlock the preparation dependency.
      group: kis-real-token
      cancel-in-progress: false
    # Oracle Cloud 셋업 완료 후 아래 줄을 교체:
    #   runs-on: [self-hosted, oracle-kr-trader]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require fresh published signal before enabling broker access
        run: python scripts/check_kr_signal_ready.py --require-ready

      - name: Run open execution A (eod_fixed)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          KIS_VIRTUAL_ACCOUNT: "false"
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python multi_allocator_plus_trader.py \
            --start-date 2026-01-01 \
            --real \
            --min-trade 50000 \
            --signal-mode eod_fixed \
            --signal-repair-mode on \
            --require-private-inputs \
            --execution-recheck \
            --recheck-price-band-pct 3.0

      - name: Commit execution report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports/execution
          git add reports/execution/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: open execution report $(date -u +%Y-%m-%d)"
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
