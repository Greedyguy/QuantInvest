name: Daily EOD Signal Prep

on:
  schedule:
    # KST 16:10 (장 마감 40분 후) = UTC 07:10, 월~금
    - cron: "10 7 * * 1-5"
  workflow_dispatch: {}

jobs:
  prep-signal:
    # Oracle Cloud 셋업 완료 후 아래 줄을 교체:
    #   runs-on: [self-hosted, oracle-kr-trader]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare EOD signal snapshot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python multi_allocator_plus_trader.py \
            --start-date 2026-01-01 \
            --prepare-signal-only \
            --signal-mode live

      - name: Commit and push signal snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/signals/
          git diff --cached --quiet || git commit -m "chore: EOD signal snapshot $(date -u +%Y-%m-%d)"
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
